<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8c1e2a">
  <meta name="description" content="用吉利数字凑出一百分，打开给太姥姥的百岁祝福。">
  <title>百岁祝福 · 凑出一百分</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238c1e2a'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='serif' font-size='43' fill='%23f6cc73'%3E%E5%AF%BF%3C/text%3E%3C/svg%3E">
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:#491e22; background:#8c1e2a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:radial-gradient(circle at 50% -12%,#b74848 0,#8c1e2a 45%,#651821 100%); }
    body::before { content:""; pointer-events:none; position:fixed; inset:12px; border:1px solid rgba(255,221,150,.35); border-radius:24px; }
    main { width:min(100% - 28px,440px); min-height:100svh; margin:auto; display:flex; align-items:center; justify-content:center; padding:28px 0; }
    .card { position:relative; width:100%; background:#fff8e9; border-radius:25px; padding:26px 22px 24px; box-shadow:0 24px 56px rgba(39,5,9,.35); text-align:center; overflow:hidden; }
    .card::before,.card::after { content:"✦"; position:absolute; color:#d5a555; font-size:22px; top:21px; }
    .card::before { left:20px; }.card::after { right:20px; }
    .eyebrow { color:#a77a4a; font-size:12px; letter-spacing:.25em; font-weight:700; }
    .seal { width:52px; height:52px; display:grid; place-items:center; margin:12px auto 10px; border:2px solid #ba4449; outline:1px solid #dfaa72; outline-offset:3px; border-radius:50%; color:#b73840; font:29px/1 "Songti SC","SimSun",serif; }
    h1 { font:700 clamp(29px,8vw,37px)/1.28 "Songti SC","SimSun",serif; color:#9c2934; margin:0 0 10px; }
    .sub { margin:0 0 16px; font-size:14px; color:#795552; line-height:1.55; }
    .digits { display:flex; gap:9px; justify-content:center; margin:0 0 15px; }
    .digit { display:grid; place-items:center; width:54px; height:58px; border-radius:12px; background:#fff; border:1px solid #e7c997; box-shadow:0 3px 0 #e7c997; color:#a72f3a; font-size:29px; font-weight:700; }
    .rule { margin:0 0 13px; color:#795552; font-size:13px; line-height:1.55; }
    .label { display:block; text-align:left; font-size:13px; font-weight:700; color:#784945; margin:0 0 6px; }
    .expression { width:100%; height:55px; display:flex; align-items:center; overflow-x:auto; white-space:nowrap; text-align:left; padding:0 15px; border:1.5px solid #d6a574; border-radius:13px; background:#fff; font-size:24px; color:#831e29; letter-spacing:.02em; }
    .placeholder { color:#b7a39a; font-size:16px; letter-spacing:0; }
    .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:13px; }
    button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    .key { height:51px; border:1px solid #e5c9a8; background:#fffdf7; border-radius:12px; color:#742d31; font-size:23px; font-weight:650; box-shadow:0 3px 0 #e9d7be; }
    .key.op { background:#f5e5ca; font-size:25px; }
    .key.utility { font-size:16px; background:#f4ebdc; }
    .key:active,.submit:active,.next:active { transform:translateY(2px); box-shadow:none; }
    .key.hint { outline:3px solid #b3313a; background:#ffdfa3; animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { outline-color:#f2c867; } }
    .submit,.next { width:100%; min-height:49px; border:0; border-radius:12px; background:#aa303c; color:#fff9e8; font-weight:700; font-size:17px; margin-top:14px; box-shadow:0 4px 0 #7d1d29; }
    .feedback { min-height:25px; margin:11px 0 0; font-size:14px; color:#9d2b34; line-height:1.55; }
    .tip { display:none; margin:12px 0 0; padding:10px; background:#fff0ca; border-radius:10px; color:#87343a; line-height:1.5; font-size:15px; }
    .tip.visible { display:block; }.solution { font-size:19px; font-weight:700; }
    .footer { color:#aa825b; font-size:12px; letter-spacing:.16em; margin:13px 0 0; }
    .hidden { display:none!important; }
    .wish { color:#84333a; font:20px/1.65 "Songti SC","SimSun",serif; margin:14px 0 22px; }
    .video-frame { min-height:220px; display:grid; place-items:center; padding:26px; border:1px solid #e1c38e; border-radius:17px; background:linear-gradient(145deg,#fff4d8,#f9e5c8); }
    .video-frame p { font-size:16px; line-height:1.7; margin:0; color:#7b5143; }
    video { display:block; width:100%; max-height:57svh; background:#2c1618; border-radius:14px; }
    @media(max-height:740px) { main { align-items:flex-start; } .card { padding-top:20px; }.seal { margin:8px auto; }.digit { height:50px; }.key { height:47px; } }
    @media(max-width:360px) { .card { padding:22px 16px; } .digit { width:48px; height:53px; } .keys { gap:7px; } }
  </style>
</head>
<body>
<main>
  <section class="card" id="game" aria-label="百岁祝福算数题">
    <div class="eyebrow">一份给太姥姥的惊喜</div><div class="seal" aria-hidden="true">寿</div>
    <h1>凑出一百分</h1><p class="sub">解开这道小题，开启百岁生日祝福</p>
    <div class="digits" aria-label="数字六、六、八、八"><span class="digit">6</span><span class="digit">6</span><span class="digit">8</span><span class="digit">8</span></div>
    <p class="rule">四个数字各用一次，只用加减乘除与括号。<br>点击下方按键，让结果等于 100。</p>
    <span class="label">你的算式</span><div class="expression" id="expression" role="textbox" aria-label="你的算式" aria-readonly="true"><span class="placeholder">点按下面的数字和符号</span></div>
    <div class="keys" aria-label="算式键盘">
      <button class="key" type="button" data-key="6">6</button><button class="key" type="button" data-key="8">8</button><button class="key op" type="button" data-key="+">＋</button><button class="key op" type="button" data-key="-">－</button>
      <button class="key op" type="button" data-key="*">×</button><button class="key op" type="button" data-key="/">÷</button><button class="key op" type="button" data-key="(">（</button><button class="key op" type="button" data-key=")">）</button>
      <button class="key utility" type="button" data-key="back">⌫ 删除</button><button class="key utility" type="button" data-key="clear">清空</button><button class="key utility" type="button" data-key="6">6</button><button class="key utility" type="button" data-key="8">8</button>
    </div>
    <button class="submit" id="check" type="button">看看答案对不对</button>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <p class="tip" id="hint">小提示：试着用 <strong>×</strong> 和 <strong>＋</strong> 来算。</p>
    <div class="tip" id="reveal" role="status" aria-live="polite">答案是 <span class="solution">6 × 6 ＋ 8 × 8 ＝ 100</span><br>现在一起打开祝福！</div>
    <p class="footer">福寿绵长 · 欢喜常伴</p>
  </section>
  <section class="card hidden" id="celebration" aria-label="百岁生日祝福">
    <div class="eyebrow">一百分的祝福</div><div class="seal" aria-hidden="true">寿</div>
    <h1>太姥姥，生日快乐！</h1>
    <p class="wish">六六大顺，八方来福。<br>愿您福寿绵长，岁岁欢喜。</p>
    <div id="media" class="video-frame"><p>祝寿视频正在制作中。<br>做好以后，这里就能点击播放啦！</p></div>
    <p class="footer">来自家人的祝福 ♡</p>
  </section>
</main>
<script>
(() => {
  const game=document.getElementById('game'), celebration=document.getElementById('celebration');
  const display=document.getElementById('expression'), feedback=document.getElementById('feedback');
  const hint=document.getElementById('hint'), reveal=document.getElementById('reveal');
  let expression='', startedAt=null, finished=false, timer=null;

  function showExpression(){
    const symbols={'*':'×','/':'÷','-':'−'};
    display.textContent=expression ? [...expression].map(x=>symbols[x]||x).join('') : '';
    if(!expression){const span=document.createElement('span');span.className='placeholder';span.textContent='点按下面的数字和符号';display.append(span)}
    display.scrollLeft=display.scrollWidth;
  }
  function showVideo(){
    if(finished && !game.classList.contains('hidden')){
      clearInterval(timer);game.classList.add('hidden');celebration.classList.remove('hidden');window.scrollTo(0,0);
    }
  }
  function finishWithAnswer(){
    if(finished)return;
    finished=true;feedback.textContent='';reveal.classList.add('visible');
    document.querySelectorAll('.key').forEach(key=>key.disabled=true);
    document.getElementById('check').textContent='打开生日祝福';
    document.getElementById('check').onclick=showVideo;
    setTimeout(showVideo,4500);
  }
  function tick(){
    if(startedAt===null||finished)return;
    const seconds=(Date.now()-startedAt)/1000;
    if(seconds>=420){finishWithAnswer();return}
    if(seconds>=180){hint.classList.add('visible');document.querySelectorAll('[data-key="*"],[data-key="+"]').forEach(key=>key.classList.add('hint'))}
  }
  function press(key){
    if(finished)return;
    if(key==='back')expression=expression.slice(0,-1);
    else if(key==='clear')expression='';
    else if(expression.length<40){expression+=key;if(startedAt===null){startedAt=Date.now();timer=setInterval(tick,500)}}
    feedback.textContent='';showExpression();tick();
  }
  document.querySelectorAll('[data-key]').forEach(button=>button.addEventListener('click',()=>press(button.dataset.key)));

  function evaluate(input){
    const counts={6:0,8:0};let index=0;const tokens=input.match(/\d+|[()+*\/-]/g)||[];
    if(!input||tokens.join('')!==input)throw Error('请用下方按键写出算式。');
    function primary(){
      const t=tokens[index++];
      if(t==='('){const value=sum();if(tokens[index++]!==')')throw Error('括号没有配对。');return value}
      if(t==='6'||t==='8'){counts[t]++;return Number(t)}
      throw Error('请检查算式中的数字和括号。');
    }
    function product(){let value=primary();while(tokens[index]==='*'||tokens[index]==='/'){const op=tokens[index++],right=primary();if(op==='/'&&right===0)throw Error('不能除以零。');value=op==='*'?value*right:value/right}return value}
    function sum(){let value=product();while(tokens[index]==='+'||tokens[index]==='-'){const op=tokens[index++],right=product();value=op==='+'?value+right:value-right}return value}
    const value=sum();if(index!==tokens.length)throw Error('请检查算式是否写完整。');
    if(counts[6]!==2||counts[8]!==2)throw Error('6 和 8 都要各用两次哦。');
    return Math.abs(value-100)<1e-9;
  }
  function check(){
    if(finished){showVideo();return}
    try{if(evaluate(expression)){finished=true;clearInterval(timer);feedback.textContent='答对啦！正在打开祝福…';setTimeout(showVideo,1000)}
      else feedback.textContent='还差一点点，再试试看！'}
    catch(error){feedback.textContent=error.message}
  }
  document.getElementById('check').addEventListener('click',check);
  document.addEventListener('keydown',event=>{
    if(game.classList.contains('hidden')||finished)return;
    if('68+-*/()'.includes(event.key)&&event.key.length===1){press(event.key);event.preventDefault()}
    else if(event.key==='Backspace'){press('back');event.preventDefault()}
    else if(event.key==='Enter'){check();event.preventDefault()}
  });
  if(document.modelContext?.registerTool){
    try{void Promise.resolve(document.modelContext.registerTool({name:'submit_birthday_expression',title:'提交生日算式',description:'用 6、6、8、8 各一次提交一个算式并更新页面。',inputSchema:{type:'object',properties:{expression:{type:'string'}},required:['expression'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){
      if(typeof input?.expression!=='string'||!/^[68+*\/()\-]{1,40}$/.test(input.expression))throw Error('无效算式');
      if(startedAt===null){startedAt=Date.now();timer=setInterval(tick,500)}
      expression=input.expression;showExpression();check();return {accepted:finished,message:feedback.textContent};
    }})).catch(()=>{})}catch(_error){}
  }
  showExpression();
})();
</script>
</body>
</html>
